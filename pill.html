<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>hearit pill</title>
    <style>
      /* Transparent window: the pill is the only visible surface. This is
         a dark-only overlay, so the dark-mode rules ARE the rules: no
         shadows, definition from a 1px inset ring, opacity-based dividers,
         and ONE temperature of dark — the surface is the matrix's own
         background color (#10151a), so the locked cell palette sits in the
         surface it was tuned against instead of on a mismatched panel. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }

      /* Concentric geometry: the matrix is a rectangle, so the shell is a
         rounded rectangle, not a capsule — a capsule leaves dead crescents
         at both ends of a rectangular grid. The shell radius is DERIVED:
         cell radius + content padding, enforced with calc so it can't
         drift when either token changes. */
      :root {
        --pad: 12px;
        --cell-round: 2px;
        --cell-gap: 3px;
        --radius: calc(var(--pad) + var(--cell-round)); /* 14px */
        --off: #1b2229;
        --body: #38944c;
        --cap: #50be62;
      }

      #pill {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        /* Left pad only: the right edge ends in the stop cap, which owns
           its own space. Vertical centering supplies the 12px above and
           below the grid. */
        padding-left: var(--pad);
        /* Fully opaque, on purpose: translucency let whatever was behind
           the pill play with the matrix's details, and Windows acrylic
           re-tinted the whole surface. A solid pane of the matrix's own
           background is calmer than either. */
        background: rgb(16, 21, 26);
        border-radius: var(--radius);
        overflow: hidden; /* the stop cap inherits the right corners */
        box-sizing: border-box;
      }
      /* The ring rides above the children (the stop cap's hover fill must
         not erase it), so it lives on an overlay, not the surface. */
      #pill::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
        pointer-events: none;
      }

      /* ==========================================================
         The dot-matrix spectrum — untouched, per the locked design
         decisions (6 rows x 32 bands, GitHub-green, lighter cap on
         the topmost lit cell, no peak hold). Its container padding
         and background are gone because the pill IS the surface now.
         ========================================================== */
      .spectrum {
        display: flex;
        gap: var(--cell-gap);
        flex: 1;
        contain: layout paint; /* isolate repaints from the shell */
        will-change: contents;
      }
      .spectrum .band {
        display: flex;
        flex-direction: column-reverse; /* child 1 is the BOTTOM cell */
        gap: var(--cell-gap);
        flex: 1;
      }
      .spectrum .cell {
        aspect-ratio: 1;
        border-radius: var(--cell-round);
        background: var(--off);
        box-shadow: none;
      }
      /* The "diffused" treatment — the prototype's default: a frosted
         emitter (radial gradient) plus a soft glow. */
      .t-diffused {
        --body-bg: radial-gradient(circle at 50% 42%, rgba(255, 255, 255, 0.42), var(--body) 62%);
        --body-fx: 0 0 8px rgba(56, 148, 76, 0.67);
        --cap-bg: radial-gradient(circle at 50% 42%, rgba(255, 255, 255, 0.42), var(--cap) 62%);
        --cap-fx: 0 0 8px rgba(80, 190, 98, 0.67);
      }
      /* Per-height rules are generated by pill.ts into #genstyle. */

      /* The off switch, as structure instead of ornament: a full-height
         end cap behind a hairline divider — the pill's third column, not
         a floating glyph. Divider is opacity-based, inset from the edges
         like a toast's close affordance. */
      #divider {
        flex: none;
        align-self: stretch;
        width: 1px;
        margin: 10px 0 10px var(--pad);
        background: rgba(255, 255, 255, 0.08);
      }
      #stop {
        flex: none;
        align-self: stretch;
        width: 44px;
        padding: 0;
        border: none;
        background: transparent;
        color: #8b949e; /* dormant, like an unlit cell; wakes on hover */
        display: grid;
        place-items: center;
        cursor: pointer;
      }
      #stop:hover {
        background: rgba(255, 255, 255, 0.05);
        color: #e6edf3;
      }
      #stop:active {
        background: rgba(255, 255, 255, 0.09);
      }
      #stop:focus-visible {
        outline: 2px solid var(--cap);
        outline-offset: -4px;
      }
      #stop svg {
        width: 16px;
        height: 16px;
        fill: currentColor;
      }
    </style>
  </head>
  <body>
    <div id="pill">
      <div class="spectrum t-diffused" id="viz" role="img" aria-label="voice spectrum"></div>
      <div id="divider" aria-hidden="true"></div>
      <button id="stop" aria-label="Stop speaking">
        <!-- Heroicons 16/solid x-mark -->
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M5.28 4.22a.75.75 0 0 0-1.06 1.06L6.94 8l-2.72 2.72a.75.75 0 1 0 1.06 1.06L8 9.06l2.72 2.72a.75.75 0 1 0 1.06-1.06L9.06 8l2.72-2.72a.75.75 0 0 0-1.06-1.06L8 6.94 5.28 4.22Z" />
        </svg>
      </button>
    </div>
    <style id="genstyle"></style>
    <script type="module" src="/src/pill.ts"></script>
  </body>
</html>
