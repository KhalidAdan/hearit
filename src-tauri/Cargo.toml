[package]
name = "hearit"
version = "0.2.0"
license = "MIT"
description = "The key that speaks. Select anything, press the key, hear it read aloud."
authors = ["Khalid"]
edition = "2021"

[lib]
# The `_lib` suffix avoids a lib/bin name collision on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "hearit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
enigo = "0.6"
# Localhost HTTP to the sidecar only — no TLS, no default features.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio = { version = "1", features = ["time"] }
rodio = "0.20"
rustfft = "6"
