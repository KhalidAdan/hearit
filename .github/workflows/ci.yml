# On every push: typecheck + build the frontend, run the Rust unit tests.
# Anything needing a speaker, a GPU, or a desktop stays on Khalid's
# machine by design — CI proves the code compiles and the pure logic
# (quantizer, band map, tap, paths) holds.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # tsc (strict, includes the Effect coordinator) + vite build, which
      # also produces dist/ so tauri's context macro is satisfied.
      - run: npm run build
      # The normalize pass: every rule proven by its friction entry's
      # literal example (docs/friction.md).
      - run: npm test

      - uses: dtolnay/rust-toolchain@stable
      # Caches ~/.cargo and target/ keyed on Cargo.lock — the difference
      # between a 20-minute and a 4-minute run.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo test
        working-directory: src-tauri
        run: cargo test
